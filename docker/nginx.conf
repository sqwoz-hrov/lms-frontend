server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  charset utf-8;

  location = /healthz {
    default_type text/plain;
    access_log off;
    return 200 "ok\n";
  }

  location = /lms {
    return 308 /lms/;
  }

  # Vite fingerprints files in this directory, so they can be cached indefinitely.
  location /lms/assets/ {
    try_files $uri =404;
    access_log off;
    log_not_found off;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location = /lms/index.html {
    add_header Cache-Control "no-store";
  }

  # Preserve /lms through Traefik and fall back to the SPA shell for client routes.
  location /lms/ {
    try_files $uri $uri/ /lms/index.html;
  }

  location / {
    return 404;
  }

  gzip on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
