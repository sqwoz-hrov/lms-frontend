services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_MODE: ${VITE_MODE:-production}
        VITE_API_URL: ${VITE_API_URL:-/lms-api}
        VITE_FRONTEND_URL_PREFIX: /lms
        VITE_INTERVIEW_UPLOAD_MOCK: ${VITE_INTERVIEW_UPLOAD_MOCK:-false}
        VITE_TELEGRAM_BOT_NAME: ${VITE_TELEGRAM_BOT_NAME:-}
        VITE_TELEGRAM_SUPPORT_USERNAME: ${VITE_TELEGRAM_SUPPORT_USERNAME:-}
    container_name: lms-frontend
    restart: unless-stopped
    networks:
      - traefik
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.lms-frontend.rule=Host(`sqwoz-hrov.ru`) && (Path(`/lms`) || PathPrefix(`/lms/`))'
      - 'traefik.http.routers.lms-frontend.entrypoints=websecure'
      - 'traefik.http.routers.lms-frontend.tls=true'
      - 'traefik.http.routers.lms-frontend.tls.certresolver=myresolver'
      - 'traefik.http.routers.lms-frontend.service=lms-frontend'
      - 'traefik.http.services.lms-frontend.loadbalancer.server.port=80'
      - 'traefik.docker.network=${TRAEFIK_NETWORK:-traefik_public}'
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik_public}
