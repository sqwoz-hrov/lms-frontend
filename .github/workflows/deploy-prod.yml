name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'main'

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v3

      - name: 🚀 Deploy to Production via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_IP }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            cd "${{ secrets.PROJECT_DIRECTORY }}"
            git fetch origin
            git checkout "${{ github.event.inputs.branch }}"
            git pull --ff-only origin "${{ github.event.inputs.branch }}"
            echo "Deploying commit $(git rev-parse HEAD)"
            docker compose -f prod.docker-compose.yml build --pull --no-cache
            docker compose -f prod.docker-compose.yml up -d --force-recreate
            docker compose -f prod.docker-compose.yml ps
