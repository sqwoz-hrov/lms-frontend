name: Deploy to Stage

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'main'
  push:
  pull_request:
    branches: [main]

env:
  BRANCH_NAME: ${{ inputs.branch || github.head_ref || github.ref_name }}

jobs:
  deploy:
    name: Deploy to Stage
    runs-on: ubuntu-latest
    environment: stage

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v3

      - name: 🚀 Deploy to Stage via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGE_IP }}
          username: ${{ secrets.STAGE_USER }}
          key: ${{ secrets.STAGE_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            cd "${{ secrets.PROJECT_DIRECTORY }}"
            git fetch origin
            git checkout "${{ env.BRANCH_NAME }}"
            git pull origin "${{ env.BRANCH_NAME }}"
            echo "Deploying commit $(git rev-parse HEAD)"
            docker compose -f stage.docker-compose.yml build --pull --no-cache
            docker compose -f stage.docker-compose.yml up -d --force-recreate
            docker compose -f stage.docker-compose.yml ps
